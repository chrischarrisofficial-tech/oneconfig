[project]
name = "oneconfig"
version = "0.1.0"
description = "Visual router and switch config builder with security audit"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["jinja2>=3.1.6", "pydantic>=2.14.1"]

[project.optional-dependencies]
discover = ["netmiko>=4.8.0", "pysnmp>=7.1.30", "pyserial>=3.5", "keyring>=25.7.0", "cryptography>=50.0.2"]  # Discover and Push (cryptography: encrypted backups)
app = ["pywebview>=6.2.1", "pyinstaller>=6.22.3", "oneconfig[discover]"]  # the macOS app: packaging/OneConfig.spec
dev = ["pytest", "snmpsim>=1.2.2", "pysmi", "playwright", "oneconfig[discover]"]

[project.scripts]
oneconfig = "oneconfig.__main__:main"

[tool.setuptools.packages.find]
include = ["oneconfig*"]  # packaging/ (the app build) and tests/ are not part of the package

[tool.setuptools.package-data]
oneconfig = ["templates/*.j2", "ui/*.html", "ui/*.js", "examples/*.json", "stig/*.json", "stig/*.json.gz"]
