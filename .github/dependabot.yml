# Weekly update pull requests; security fixes arrive as soon as an advisory is published.
# After merging a Python update, recompile the locks (see CONTRIBUTING.md) so requirements/*.lock match.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # The ranges in pyproject.toml are minimums; the versions actually used come from requirements/*.lock, which
    # Dependabot can't recompile. Raising every minimum to the latest release would, among other things, require a
    # cryptography that doesn't install on Intel Macs. So only raise a range when a needed version is outside it.
    versioning-strategy: increase-if-necessary
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
