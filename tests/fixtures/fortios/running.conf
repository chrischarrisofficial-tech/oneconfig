#config-version=FGT100F-7.4.4-FW-build2662-240514:opmode=0:vdom=0:user=admin
#conf_file_ver=1234567890
#buildno=2662
#global_vdom=1
config system global
    set hostname "EDGE-FW2"
    set admintimeout 480
    set admin-lockout-threshold 3
    set admin-lockout-duration 60
    set admin-concurrent enable
    set pre-login-banner disable
    set timezone "US/Pacific"
end
config system console
    set output more
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 203.0.113.2 255.255.255.248
        set allowaccess ping https ssh http
        set type physical
        set role wan
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.0.1 255.255.255.248
        set allowaccess ping https ssh
        set type physical
        set role lan
    next
    edit "port3"
        set vdom "root"
        set ip 172.16.10.1 255.255.255.0
        set allowaccess ping
        set type physical
    next
    edit "port8"
        set vdom "root"
        set type physical
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SH2nlSm9QL9tapcHPXIqAXvX7vBJuuqu8xb4tb7Ar7o+bA0aBr/ZaD3dlh1E9o=
    next
end
config system snmp community
    edit 1
        set name "public"
    next
end
config system zone
    edit "OUTSIDE"
        set interface "port1"
    next
    edit "INSIDE"
        set interface "port2"
    next
    edit "DMZ"
        set interface "port3"
    next
end
config system ha
    set group-name "LEGACY"
    set mode a-p
    set password ENC wWjZ9rNOUNfHnJEaQkRUJ4zwh9mZr1b6OTN6YZ0FzrpeEO0w==
    set hbdev "port8" 50
end
config firewall address
    edit "all"
        set uuid 3d2a8d6e-0000-51ef-0000-000000000001
    next
    edit "INSIDE-NETS"
        set subnet 10.0.0.0 255.0.0.0
    next
end
config firewall policy
    edit 7
        set name "allow-all"
        set srcintf "INSIDE"
        set dstintf "OUTSIDE"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
    next
end
config router static
    edit 1
        set gateway 203.0.113.1
        set device "port1"
    next
    edit 2
        set dst 192.0.2.0 255.255.255.0
        set gateway 10.0.0.2
        set device "port2"
    next
end
config log syslogd setting
    set status enable
    set server "10.99.0.99"
end
config firewall service custom
    edit "DNS"
        set tcp-portrange 53
        set udp-portrange 53
    next
end
