set protocols bgp log-updown
set protocols bgp enforce-first-as
set protocols bgp group EBGP-AS64500 type external
set protocols bgp group EBGP-AS64500 peer-as 64500
set protocols bgp group EBGP-AS64500 ttl 255
set protocols bgp group EBGP-AS64500 import BGP-IN
set protocols bgp group EBGP-AS64500 export BGP-OUT
set protocols bgp group EBGP-AS64500 neighbor 203.0.113.1 description "ISP-A"
set protocols bgp group EBGP-AS64500 neighbor 203.0.113.1 authentication-algorithm hmac-sha-1-96
set protocols bgp group EBGP-AS64500 neighbor 203.0.113.1 authentication-key-chain BGP-AS64500
