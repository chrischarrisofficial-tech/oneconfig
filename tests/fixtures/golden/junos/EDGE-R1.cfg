set interfaces ge-0/0/1 unit 0 family inet address 10.0.0.1/30
set interfaces ge-0/0/1 unit 0 family inet no-redirects
set interfaces ge-0/0/1 unit 0 family inet rpf-check
set interfaces ge-0/0/1 unit 0 family inet filter input EGRESS-FILTER
set interfaces lo0 unit 0 family inet address 10.255.0.1/32
set interfaces lo0 unit 0 family inet filter input PROTECT-RE
set protocols lldp interface all
set protocols lldp interface ge-0/0/0 disable
set routing-options router-id 10.255.0.1
set routing-options autonomous-system 65010
set routing-options static route 198.51.100.0/24 discard
set protocols ospf reference-bandwidth 100000m
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0
set protocols ospf area 0.0.0.0 interface ge-0/0/1.0 authentication keychain OSPF-KEYS
set protocols ospf area 0.0.0.0 interface lo0.0 passive
set security authentication-key-chains key-chain OSPF-KEYS key 1 secret "<OSPF-KEY>"
set security authentication-key-chains key-chain OSPF-KEYS key 1 start-time 2026-10-17.00:00
set security authentication-key-chains key-chain OSPF-KEYS key 1 algorithm hmac-sha-1
set policy-options prefix-list BOGONS 0.0.0.0/8
set policy-options prefix-list BOGONS 10.0.0.0/8
set policy-options prefix-list BOGONS 100.64.0.0/10
set policy-options prefix-list BOGONS 127.0.0.0/8
set policy-options prefix-list BOGONS 169.254.0.0/16
set policy-options prefix-list BOGONS 172.16.0.0/12
set policy-options prefix-list BOGONS 192.0.0.0/24
set policy-options prefix-list BOGONS 192.0.2.0/24
set policy-options prefix-list BOGONS 192.88.99.0/24
set policy-options prefix-list BOGONS 192.168.0.0/16
set policy-options prefix-list BOGONS 198.18.0.0/15
set policy-options prefix-list BOGONS 198.51.100.0/24
set policy-options prefix-list BOGONS 203.0.113.0/24
set policy-options prefix-list BOGONS 224.0.0.0/4
set policy-options prefix-list BOGONS 240.0.0.0/4
set policy-options prefix-list OUR-PREFIXES 198.51.100.0/24
set policy-options policy-statement BGP-IN term REJECT-BOGONS from prefix-list-filter BOGONS orlonger
set policy-options policy-statement BGP-IN term REJECT-BOGONS then reject
set policy-options policy-statement BGP-IN term REJECT-OURS from prefix-list-filter OUR-PREFIXES orlonger
