set protocols bgp group EBGP-AS64500 neighbor 203.0.113.1 family inet unicast prefix-limit teardown 90
set security authentication-key-chains key-chain BGP-AS64500 key 1 secret "<BGP-AS64500-KEY>"
set security authentication-key-chains key-chain BGP-AS64500 key 1 start-time 2026-10-17.00:00
set firewall policer CRITICAL filter-specific
