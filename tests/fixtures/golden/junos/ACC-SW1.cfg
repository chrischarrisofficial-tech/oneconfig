## OneConfig | Campus Starter | ACC-SW1 (switch, Junos)
## Replace every <ANGLE-BRACKET> placeholder before deploying. OneConfig hashes <...SHA512> values itself.
set system host-name ACC-SW1
set system domain-name corp.local
set system time-zone UTC
set system no-redirects
set system root-authentication encrypted-password "<ROOT-SECRET.SHA512>"
set system ports console log-out-on-disconnect
set system rng hmac-drbg
set system login class ONECONFIG-ADMIN idle-timeout 5
set system login class ENGINEER idle-timeout 5
set system login class AUDITOR idle-timeout 5
set system login class ONECONFIG-ADMIN permissions all
set system login class ENGINEER permissions all
set system login class ENGINEER deny-commands "(file delete)|(request system software)"
set system login class ENGINEER deny-configuration-regexps "system syslog .*"
set system login class AUDITOR permissions configure
set system login class AUDITOR permissions view
set system login class AUDITOR permissions view-configuration
set system login class AUDITOR allow-configuration-regexps "system syslog .*"
## Local account of last resort, used only when the AAA servers don't answer
set system login user <ADMIN-USER> class ONECONFIG-ADMIN
set system login user <ADMIN-USER> authentication encrypted-password "<ADMIN-SECRET.SHA512>"
set system login user remote class ENGINEER
set system login retry-options tries-before-disconnect 3
set system login retry-options lockout-period 15
set system login password minimum-length 15
set system login password minimum-upper-cases 1
set system login password minimum-lower-cases 1
set system login password minimum-numerics 1
set system login password minimum-punctuations 1
set system login password minimum-character-changes 8
set system login password format sha512
set system login message "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.\nBy using this IS (which includes any device attached to this IS), you consent to the following conditions:\n-The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.\n-At any time, the USG may inspect and seize data stored on this IS.\n-Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.\n-This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy.\n-Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details."
set system authentication-order tacplus
set system authentication-order radius
set system tacplus-server 10.99.0.40 secret "<TACACS-KEY>"
set system tacplus-server 10.99.0.41 secret "<TACACS-KEY>"
set system radius-server 10.99.0.50 secret "<RADIUS-KEY>"
set system radius-server 10.99.0.51 secret "<RADIUS-KEY>"
set system accounting events login
set system accounting events change-log
set system accounting events interactive-commands
set system accounting destination tacplus
set system services ssh root-login deny
set system services ssh protocol-version v2
set system services ssh connection-limit 3
set system services ssh max-sessions-per-connection 1
set system services ssh ciphers aes256-ctr
set system services ssh ciphers aes128-ctr
set system services ssh macs hmac-sha2-512
set system services ssh macs hmac-sha2-256
set system services ssh key-exchange ecdh-sha2-nistp521
set system services ssh key-exchange ecdh-sha2-nistp384
set system services ssh key-exchange ecdh-sha2-nistp256
set system syslog time-format year
set system syslog time-format millisecond
set system syslog file messages any info
set system syslog file messages authorization info
set system syslog file messages change-log info
set system syslog file messages interactive-commands info
set system syslog file messages firewall any
set system syslog file messages archive size 1000000
set system syslog file messages archive files 12
set system syslog file messages archive no-world-readable
set system syslog host 10.99.0.20 any info
set system syslog host 10.99.0.21 any info
set system ntp authentication-key 1 type sha256
set system ntp authentication-key 1 value "<NTP-KEY>"
set system ntp trusted-key 1
set system ntp server 10.99.0.10 key 1
set system ntp server 10.99.0.10 prefer
set system ntp server 10.99.0.11 key 1
set system archival configuration transfer-on-commit
set system archival configuration archive-sites "scp://<BACKUP-USER>@10.99.0.60:/oneconfig/ACC-SW1" password "<BACKUP-PASS>"
set chassis aggregated-devices ethernet device-count 1
set snmp v3 usm local-engine user <SNMP-USER> authentication-sha256 authentication-password "<SNMP-AUTH-PASS>"
set snmp v3 usm local-engine user <SNMP-USER> privacy-aes128 privacy-password "<SNMP-PRIV-PASS>"
set snmp v3 vacm security-to-group security-model usm security-name <SNMP-USER> group ONECONFIG-RO
set snmp v3 vacm access group ONECONFIG-RO default-context-prefix security-model usm security-level privacy read-view ALL
set snmp view ALL oid .1 include
set interfaces ae1 description "to CORE-SW1"
set interfaces ae1 aggregated-ether-options lacp active
set interfaces ae1 native-vlan-id 999
set interfaces ae1 unit 0 family ethernet-switching interface-mode trunk
set interfaces ae1 unit 0 family ethernet-switching vlan members 10
set interfaces ae1 unit 0 family ethernet-switching vlan members 20
set interfaces ae1 unit 0 family ethernet-switching vlan members 99
set interfaces ae1 unit 0 family ethernet-switching vlan members 999
set interfaces ge-0/0/46 ether-options 802.3ad ae1
set interfaces ge-0/0/47 ether-options 802.3ad ae1
set interfaces ge-0/0/0 description "Desk 101"
set interfaces ge-0/0/0 unit 0 family ethernet-switching interface-mode access
set interfaces ge-0/0/0 unit 0 family ethernet-switching vlan members USERS
set interfaces ge-0/0/0 unit 0 family ethernet-switching storm-control STORM-CONTROL
set interfaces irb unit 99 family inet address 10.99.0.11/24
set interfaces irb unit 99 family inet no-redirects
set interfaces lo0 unit 0 family inet filter input PROTECT-RE
set vlans USERS vlan-id 10
set vlans VOICE vlan-id 20
set vlans MGMT vlan-id 99
set vlans MGMT l3-interface irb.99
set vlans PARKING vlan-id 998
set vlans NATIVE-UNUSED vlan-id 999
set vlans USERS forwarding-options dhcp-security
set vlans USERS forwarding-options dhcp-security arp-inspection
set vlans USERS forwarding-options dhcp-security ip-source-guard
set protocols rstp bpdu-block-on-edge
set protocols rstp interface ae1 bpdu-timeout-action block
set protocols rstp interface ge-0/0/0 edge
set protocols igmp-snooping vlan all
set forwarding-options storm-control-profiles STORM-CONTROL all bandwidth-percentage 5
set access radius-server 10.99.0.50 secret "<RADIUS-KEY>"
set access radius-server 10.99.0.51 secret "<RADIUS-KEY>"
set access profile DOT1X authentication-order radius
set access profile DOT1X radius authentication-server 10.99.0.50
set access profile DOT1X radius authentication-server 10.99.0.51
set protocols dot1x authenticator authentication-profile-name DOT1X
set protocols dot1x authenticator interface ge-0/0/0.0 supplicant single-secure
set protocols dot1x authenticator interface ge-0/0/0.0 mac-radius
set protocols lldp interface all
set routing-options static route 0.0.0.0/0 next-hop 10.99.0.1
set firewall policer CRITICAL filter-specific
set firewall policer CRITICAL if-exceeding bandwidth-limit 4m
set firewall policer CRITICAL if-exceeding burst-size-limit 16k
set firewall policer CRITICAL then discard
set firewall policer IMPORTANT filter-specific
set firewall policer IMPORTANT if-exceeding bandwidth-limit 512k
set firewall policer IMPORTANT if-exceeding burst-size-limit 16k
set firewall policer IMPORTANT then discard
set firewall policer NORMAL filter-specific
set firewall policer NORMAL if-exceeding bandwidth-limit 64k
set firewall policer NORMAL if-exceeding burst-size-limit 2k
set firewall policer NORMAL then discard
set firewall policer UNDESIRABLE filter-specific
set firewall policer UNDESIRABLE if-exceeding bandwidth-limit 32k
set firewall policer UNDESIRABLE if-exceeding burst-size-limit 1500
set firewall policer UNDESIRABLE then discard
set policy-options prefix-list MGMT-NET 10.99.0.0/24
set policy-options prefix-list NTP-SERVERS 10.99.0.10/32
set policy-options prefix-list NTP-SERVERS 10.99.0.11/32
set policy-options prefix-list RADIUS-SERVERS 10.99.0.50/32
set policy-options prefix-list RADIUS-SERVERS 10.99.0.51/32
set firewall family inet filter PROTECT-RE term ICMP-FRAGMENTS from protocol icmp
set firewall family inet filter PROTECT-RE term ICMP-FRAGMENTS from is-fragment
set firewall family inet filter PROTECT-RE term ICMP-FRAGMENTS then discard
set firewall family inet filter PROTECT-RE term MASK-REQUEST from protocol icmp
set firewall family inet filter PROTECT-RE term MASK-REQUEST from icmp-type mask-request
set firewall family inet filter PROTECT-RE term MASK-REQUEST then discard
set firewall family inet filter PROTECT-RE term SSH from source-prefix-list MGMT-NET
set firewall family inet filter PROTECT-RE term SSH from protocol tcp
set firewall family inet filter PROTECT-RE term SSH from destination-port ssh
set firewall family inet filter PROTECT-RE term SSH then policer IMPORTANT
set firewall family inet filter PROTECT-RE term SSH then accept
set firewall family inet filter PROTECT-RE term DENY-SSH from protocol tcp
set firewall family inet filter PROTECT-RE term DENY-SSH from destination-port ssh
set firewall family inet filter PROTECT-RE term DENY-SSH then syslog
set firewall family inet filter PROTECT-RE term DENY-SSH then discard
set firewall family inet filter PROTECT-RE term SNMP from source-prefix-list MGMT-NET
set firewall family inet filter PROTECT-RE term SNMP from protocol udp
set firewall family inet filter PROTECT-RE term SNMP from destination-port snmp
set firewall family inet filter PROTECT-RE term SNMP then policer IMPORTANT
set firewall family inet filter PROTECT-RE term SNMP then accept
set firewall family inet filter PROTECT-RE term NTP from source-prefix-list NTP-SERVERS
set firewall family inet filter PROTECT-RE term NTP from protocol udp
set firewall family inet filter PROTECT-RE term NTP from port ntp
set firewall family inet filter PROTECT-RE term NTP then policer IMPORTANT
set firewall family inet filter PROTECT-RE term NTP then accept
set firewall family inet filter PROTECT-RE term RADIUS from source-prefix-list RADIUS-SERVERS
set firewall family inet filter PROTECT-RE term RADIUS from protocol udp
set firewall family inet filter PROTECT-RE term RADIUS from source-port radius
set firewall family inet filter PROTECT-RE term RADIUS then policer IMPORTANT
set firewall family inet filter PROTECT-RE term RADIUS then accept
set firewall family inet filter PROTECT-RE term IGMP from protocol igmp
set firewall family inet filter PROTECT-RE term IGMP then policer NORMAL
set firewall family inet filter PROTECT-RE term IGMP then accept
set firewall family inet filter PROTECT-RE term ESTABLISHED from protocol tcp
set firewall family inet filter PROTECT-RE term ESTABLISHED from tcp-established
set firewall family inet filter PROTECT-RE term ESTABLISHED then policer IMPORTANT
set firewall family inet filter PROTECT-RE term ESTABLISHED then accept
set firewall family inet filter PROTECT-RE term ICMP from protocol icmp
set firewall family inet filter PROTECT-RE term ICMP then policer NORMAL
set firewall family inet filter PROTECT-RE term ICMP then accept
set firewall family inet filter PROTECT-RE term DENY-ALL then syslog
set firewall family inet filter PROTECT-RE term DENY-ALL then discard
