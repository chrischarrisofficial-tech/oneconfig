: OneConfig | Edge Firewall | EDGE-FW1 (firewall, Cisco ASA)
: Replace every <ANGLE-BRACKET> placeholder before deploying.
hostname EDGE-FW1
domain-name corp.local
! FIPS mode (STIG CASA-ND-000470): takes effect after the next reload
fips enable
enable password <ENABLE-SECRET> level 15
!
password-policy minimum-length 15
password-policy minimum-uppercase 1
password-policy minimum-lowercase 1
password-policy minimum-numeric 1
password-policy minimum-special 1
password-policy minimum-changes 8
password-policy reuse-interval 5
! Local account of last resort, used only when the AAA servers are unreachable
username <ADMIN-USER> password <ADMIN-SECRET> privilege 15
aaa local authentication attempts max-fail 3
!
interface GigabitEthernet0/0
 description ISP uplink
 nameif OUTSIDE
 security-level 0
 ip address 203.0.113.2 255.255.255.248 standby 203.0.113.3
 no shutdown
!
interface GigabitEthernet0/1
 description to CORE-SW1
 nameif INSIDE
 security-level 100
 ip address 10.0.0.1 255.255.255.248 standby 10.0.0.2
 ospf message-digest-key 1 md5 <OSPF-KEY>
 ospf authentication message-digest
 no shutdown
!
interface GigabitEthernet0/2
 description DMZ servers
 nameif DMZ
 security-level 50
 ip address 172.16.10.1 255.255.255.0 standby 172.16.10.2
 no shutdown
!
interface GigabitEthernet0/3
 description UNUSED
 no nameif
 no security-level
 no ip address
 shutdown
!
interface GigabitEthernet0/7
 description LAN failover and state link
 no shutdown
!
interface Management0/0
 management-only
 nameif MANAGEMENT
 security-level 100
 ip address 10.99.0.5 255.255.255.0 standby 10.99.0.6
 no shutdown
!
failover
failover lan unit primary
failover lan interface FOLINK GigabitEthernet0/7
failover link FOLINK GigabitEthernet0/7
failover interface ip FOLINK 10.255.255.1 255.255.255.252 standby 10.255.255.2
failover key <FAILOVER-KEY>
! On the secondary unit, enter only these lines; it then copies everything else from this unit:
!   interface GigabitEthernet0/7 / no shutdown
!   failover lan unit secondary
!   failover lan interface FOLINK GigabitEthernet0/7
!   failover link FOLINK GigabitEthernet0/7
!   failover interface ip FOLINK 10.255.255.1 255.255.255.252 standby 10.255.255.2
!   failover key <FAILOVER-KEY>
!   failover
!
object network INSIDE-NETS
 subnet 10.0.0.0 255.0.0.0
object network DNS-SRV
 host 10.10.0.53
object network WEB-SRV
 host 172.16.10.10
object network WEB-PUBLIC
 host 203.0.113.4
object-group network DMZ-SERVERS
 network-object object WEB-SRV
object service HTTP
 service tcp destination eq 80
object service HTTPS
 service tcp destination eq 443
object service DNS-UDP
 service udp destination eq 53
object service DNS-TCP
 service tcp destination eq 53
object-group service WEB
 service-object object HTTP
 service-object object HTTPS
object-group service DNS
 service-object object DNS-UDP
 service-object object DNS-TCP
object-group network ZONE-DMZ-NETS
 network-object 172.16.10.0 255.255.255.0
!
access-list OUTSIDE_IN remark INTERNET-TO-WEB
access-list OUTSIDE_IN extended permit object HTTPS any4 object WEB-SRV log
access-list OUTSIDE_IN extended deny ip any any log
access-list INSIDE_IN remark INSIDE-TO-DMZ-WEB
access-list INSIDE_IN extended permit object-group WEB object INSIDE-NETS object-group DMZ-SERVERS log
access-list INSIDE_IN extended deny ip any4 object-group ZONE-DMZ-NETS log
access-list INSIDE_IN extended deny udp any4 any4 eq snmp log
access-list INSIDE_IN extended deny udp any4 any4 eq snmptrap log
access-list INSIDE_IN extended deny udp any4 any4 eq ntp log
access-list INSIDE_IN extended deny udp any4 any4 eq syslog log
access-list INSIDE_IN extended deny tcp any4 any4 eq ssh log
access-list INSIDE_IN extended deny tcp any4 any4 eq tacacs log
access-list INSIDE_IN remark INSIDE-TO-INTERNET-WEB
access-list INSIDE_IN extended permit object-group WEB object INSIDE-NETS any4 log
access-list INSIDE_IN remark DNS-TO-INTERNET
access-list INSIDE_IN extended permit object-group DNS object DNS-SRV any4 log
access-list INSIDE_IN extended deny ip any any log
access-list DMZ_IN extended deny udp any4 any4 eq snmp log
access-list DMZ_IN extended deny udp any4 any4 eq snmptrap log
access-list DMZ_IN extended deny udp any4 any4 eq ntp log
access-list DMZ_IN extended deny udp any4 any4 eq syslog log
access-list DMZ_IN extended deny tcp any4 any4 eq ssh log
access-list DMZ_IN extended deny tcp any4 any4 eq tacacs log
access-list DMZ_IN remark DMZ-TO-INTERNET-WEB
access-list DMZ_IN extended permit object-group WEB object-group DMZ-SERVERS any4 log
access-list DMZ_IN extended deny ip any any log
!
nat (DMZ,OUTSIDE) source static WEB-SRV WEB-PUBLIC service HTTPS HTTPS
nat (INSIDE,OUTSIDE) after-auto source dynamic INSIDE-NETS interface
nat (DMZ,OUTSIDE) after-auto source dynamic DMZ-SERVERS interface
access-group OUTSIDE_IN in interface OUTSIDE
access-group INSIDE_IN in interface INSIDE
access-group DMZ_IN in interface DMZ
!
ip verify reverse-path interface OUTSIDE
ip verify reverse-path interface INSIDE
ip verify reverse-path interface DMZ
icmp permit any unreachable OUTSIDE
icmp permit any time-exceeded OUTSIDE
icmp deny any OUTSIDE
!
route OUTSIDE 0.0.0.0 0.0.0.0 203.0.113.1 1
router ospf 1
 router-id 10.0.0.1
 network 10.0.0.0 255.255.255.248 area 0
 area 0 authentication message-digest
 log-adj-changes
!
prefix-list EBGP-IN seq 5 deny 0.0.0.0/8 le 32
prefix-list EBGP-IN seq 10 deny 10.0.0.0/8 le 32
prefix-list EBGP-IN seq 15 deny 100.64.0.0/10 le 32
prefix-list EBGP-IN seq 20 deny 127.0.0.0/8 le 32
prefix-list EBGP-IN seq 25 deny 169.254.0.0/16 le 32
prefix-list EBGP-IN seq 30 deny 172.16.0.0/12 le 32
prefix-list EBGP-IN seq 35 deny 192.0.0.0/24 le 32
prefix-list EBGP-IN seq 40 deny 192.0.2.0/24 le 32
prefix-list EBGP-IN seq 45 deny 192.88.99.0/24 le 32
prefix-list EBGP-IN seq 50 deny 192.168.0.0/16 le 32
prefix-list EBGP-IN seq 55 deny 198.18.0.0/15 le 32
prefix-list EBGP-IN seq 60 deny 198.51.100.0/24 le 32
prefix-list EBGP-IN seq 65 deny 203.0.113.0/24 le 32
prefix-list EBGP-IN seq 70 deny 224.0.0.0/4 le 32
prefix-list EBGP-IN seq 75 deny 240.0.0.0/4 le 32
prefix-list EBGP-IN seq 80 deny 0.0.0.0/0 ge 25
prefix-list EBGP-IN seq 85 permit 0.0.0.0/0 le 24
prefix-list EBGP-OUT seq 5 permit 203.0.113.0/29
router bgp 65010
 bgp log-neighbor-changes
 bgp router-id 10.0.0.1
 address-family ipv4 unicast
  neighbor 203.0.113.1 remote-as 64500
  neighbor 203.0.113.1 description ISP-A
  neighbor 203.0.113.1 password <BGP-KEY>
  neighbor 203.0.113.1 activate
  neighbor 203.0.113.1 maximum-prefix 1000
  neighbor 203.0.113.1 prefix-list EBGP-IN in
  neighbor 203.0.113.1 prefix-list EBGP-OUT out
  network 203.0.113.0 mask 255.255.255.248
  no auto-summary
  no synchronization
 exit-address-family
!
aaa-server TACACS-SERVERS protocol tacacs+
aaa-server TACACS-SERVERS (MANAGEMENT) host 10.99.0.40
 key <TACACS-KEY>
aaa-server TACACS-SERVERS (MANAGEMENT) host 10.99.0.41
 key <TACACS-KEY>
aaa authentication ssh console TACACS-SERVERS LOCAL
aaa authentication serial console TACACS-SERVERS LOCAL
aaa authentication enable console TACACS-SERVERS LOCAL
aaa authorization command TACACS-SERVERS LOCAL
aaa accounting command privilege 15 TACACS-SERVERS
aaa accounting ssh console TACACS-SERVERS
aaa authorization exec authentication-server
!
http server idle-timeout 5
http server session-timeout 5
ssh 10.99.0.0 255.255.255.0 MANAGEMENT
ssh version 2
ssh timeout 5
ssh cipher encryption fips
ssh cipher integrity fips
ssh key-exchange group dh-group14-sha256
! Run once if the unit has no RSA key yet: crypto key generate rsa modulus 3072
console timeout 5
quota management-session 5
!
