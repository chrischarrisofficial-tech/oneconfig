!
! OneConfig | Campus Starter | CORE-SW1 (l3switch, IOS-XE)
! Replace every <ANGLE-BRACKET> placeholder before deploying.
!
hostname CORE-SW1
!
service password-encryption
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service tcp-keepalives-in
service tcp-keepalives-out
no service pad
no service config
no ip http server
no ip http secure-server
no ip bootp server
no ip dns server
no ip source-route
no ip gratuitous-arps
no ip domain lookup
ip domain name corp.local
!
enable algorithm-type scrypt secret <ENABLE-SECRET>
!
aaa new-model
aaa common-criteria policy PASSWORD_POLICY
 min-length 15
 upper-case 1
 lower-case 1
 numeric-count 1
 special-case 1
 char-changes 8
!
! Local account of last resort, used only when the AAA servers are unreachable
username <ADMIN-USER> privilege 15 common-criteria-policy PASSWORD_POLICY algorithm-type scrypt secret <ADMIN-SECRET>
!
tacacs server TACACS-1
 address ipv4 10.99.0.40
 key <TACACS-KEY>
tacacs server TACACS-2
 address ipv4 10.99.0.41
 key <TACACS-KEY>
aaa group server tacacs+ TACACS-SERVERS
 server name TACACS-1
 server name TACACS-2
!
radius server RADIUS-1
 address ipv4 10.99.0.50 auth-port 1812 acct-port 1813
 key <RADIUS-KEY>
radius server RADIUS-2
 address ipv4 10.99.0.51 auth-port 1812 acct-port 1813
 key <RADIUS-KEY>
aaa group server radius RADIUS-SERVERS
 server name RADIUS-1
 server name RADIUS-2
!
aaa authentication login default group TACACS-SERVERS local
aaa authorization exec default group TACACS-SERVERS local if-authenticated
aaa accounting exec default start-stop group TACACS-SERVERS
aaa accounting commands 15 default start-stop group TACACS-SERVERS
aaa authentication dot1x default group RADIUS-SERVERS
aaa authorization network default group RADIUS-SERVERS
dot1x system-auth-control
!
login block-for 900 attempts 3 within 120
login on-failure log
login on-success log
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh server algorithm mac hmac-sha2-512 hmac-sha2-256
ip ssh server algorithm encryption aes256-ctr aes192-ctr aes128-ctr
! Generate SSH keys once from exec mode: crypto key generate rsa modulus 4096
!
archive
 path flash:oneconfig-archive
 maximum 14
 log config
  logging enable
  logging size 1000
  notify syslog contenttype plaintext
  hidekeys
!
logging userinfo
!
vtp mode off
vlan 10
 name USERS
vlan 20
 name VOICE
vlan 99
 name MGMT
vlan 998
 name PARKING
vlan 999
 name NATIVE-UNUSED
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree loopguard default
udld enable
!
ip routing
!
key chain OSPF-KEYS
 key 1
  key-string <OSPF-KEY>
  cryptographic-algorithm hmac-sha-256
  send-lifetime 00:00:00 Oct 17 2026 00:00:00 Apr 15 2027
  accept-lifetime 00:00:00 Oct 17 2026 00:00:00 Apr 15 2027
!
interface Vlan1
 no ip address
 shutdown
!
interface GigabitEthernet1/0/1
 description to EDGE-R1
 no switchport
 ip address 10.0.0.2 255.255.255.252
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 ip ospf 1 area 0
 ip ospf authentication key-chain OSPF-KEYS
 no shutdown
!
interface Port-channel1
 description to ACC-SW1
 switchport mode trunk
 switchport nonegotiate
 switchport trunk allowed vlan 10,20,99
 switchport trunk native vlan 999
 spanning-tree guard root
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
!
interface GigabitEthernet1/0/2
 switchport mode trunk
 switchport nonegotiate
 switchport trunk allowed vlan 10,20,99
 switchport trunk native vlan 999
 ip dhcp snooping trust
 ip arp inspection trust
 channel-group 1 mode active
 no shutdown
!
interface GigabitEthernet1/0/3
 switchport mode trunk
 switchport nonegotiate
 switchport trunk allowed vlan 10,20,99
 switchport trunk native vlan 999
 ip dhcp snooping trust
 ip arp inspection trust
 channel-group 1 mode active
 no shutdown
!
interface GigabitEthernet1/0/4
 description to ACC-SW2
 switchport mode trunk
 switchport nonegotiate
 switchport trunk allowed vlan 10,20,99
 switchport trunk native vlan 999
 spanning-tree guard root
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
!
interface Vlan10
 description Users gateway
 ip address 10.10.0.1 255.255.255.0
 ip helper-address 10.99.0.30
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 ip ospf 1 area 0
 no shutdown
!
interface Vlan20
 description Voice gateway
 ip address 10.20.0.1 255.255.255.0
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 ip ospf 1 area 0
 no shutdown
!
interface Vlan99
 description Management
 ip address 10.99.0.1 255.255.255.0
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 ip ospf 1 area 0
 no shutdown
!
interface Loopback0
 ip address 10.255.0.2 255.255.255.255
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 ip ospf 1 area 0
 no shutdown
!
router ospf 1
 router-id 10.255.0.2
 auto-cost reference-bandwidth 100000
 passive-interface default
 no passive-interface GigabitEthernet1/0/1
!
ip access-list standard MGMT-ACCESS
 permit 10.99.0.0 0.0.0.255
 deny any log
!
logging buffered 64000 informational
logging host 10.99.0.20
logging host 10.99.0.21
logging trap informational
ntp authentication-key 1 hmac-sha2-256 <NTP-KEY>
ntp authenticate
ntp trusted-key 1
ntp server 10.99.0.10 key 1
ntp server 10.99.0.11 key 1
!
snmp-server view ONECONFIG-VIEW iso included
snmp-server group ONECONFIG-RO v3 priv read ONECONFIG-VIEW access MGMT-ACCESS
snmp-server user <SNMP-USER> ONECONFIG-RO v3 auth sha <SNMP-AUTH-PASS> priv aes 256 <SNMP-PRIV-PASS>
!
event manager applet BACKUP_CONFIG
 event syslog pattern "%SYS-5-CONFIG_I"
 action 1 info type routername
 action 2 cli command "enable"
 action 3 cli command "copy run scp" pattern "remote host"
 action 4 cli command "10.99.0.60" pattern "filename"
 action 5 cli command "$_info_routername-config"
 action 6 syslog priority informational msg "Configuration backup was executed"
!
banner login ^
You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.
By using this IS (which includes any device attached to this IS), you consent to the following conditions:
-The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.
-At any time, the USG may inspect and seize data stored on this IS.
-Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.
-This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy.
-Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details.
^
!
line con 0
 exec-timeout 5 0
 logging synchronous
line vty 0 1
 access-class MGMT-ACCESS in
 exec-timeout 5 0
 transport input ssh
 transport output ssh
line vty 2 15
 transport input none
 transport output none
!
end