!
! OneConfig | Campus Starter | EDGE-R1 (router, IOS-XE)
! Replace every <ANGLE-BRACKET> placeholder before deploying.
!
hostname EDGE-R1
!
service password-encryption
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service tcp-keepalives-in
service tcp-keepalives-out
no service pad
no service config
no ip http server
no ip http secure-server
no ip bootp server
no ip dns server
no ip source-route
no ip gratuitous-arps
no ip domain lookup
ip domain name corp.local
!
enable algorithm-type scrypt secret <ENABLE-SECRET>
!
aaa new-model
aaa common-criteria policy PASSWORD_POLICY
 min-length 15
 upper-case 1
 lower-case 1
 numeric-count 1
 special-case 1
 char-changes 8
!
! Local account of last resort, used only when the AAA servers are unreachable
username <ADMIN-USER> privilege 15 common-criteria-policy PASSWORD_POLICY algorithm-type scrypt secret <ADMIN-SECRET>
!
tacacs server TACACS-1
 address ipv4 10.99.0.40
 key <TACACS-KEY>
tacacs server TACACS-2
 address ipv4 10.99.0.41
 key <TACACS-KEY>
aaa group server tacacs+ TACACS-SERVERS
 server name TACACS-1
 server name TACACS-2
!
radius server RADIUS-1
 address ipv4 10.99.0.50 auth-port 1812 acct-port 1813
 key <RADIUS-KEY>
radius server RADIUS-2
 address ipv4 10.99.0.51 auth-port 1812 acct-port 1813
 key <RADIUS-KEY>
aaa group server radius RADIUS-SERVERS
 server name RADIUS-1
 server name RADIUS-2
!
aaa authentication login default group TACACS-SERVERS local
aaa authorization exec default group TACACS-SERVERS local if-authenticated
aaa accounting exec default start-stop group TACACS-SERVERS
aaa accounting commands 15 default start-stop group TACACS-SERVERS
!
login block-for 900 attempts 3 within 120
login on-failure log
login on-success log
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh server algorithm mac hmac-sha2-512 hmac-sha2-256
ip ssh server algorithm encryption aes256-ctr aes192-ctr aes128-ctr
! Generate SSH keys once from exec mode: crypto key generate rsa modulus 4096
!
archive
 path flash:oneconfig-archive
 maximum 14
 log config
  logging enable
  logging size 1000
  notify syslog contenttype plaintext
  hidekeys
!
logging userinfo
!
key chain OSPF-KEYS
 key 1
  key-string <OSPF-KEY>
  cryptographic-algorithm hmac-sha-256
  send-lifetime 00:00:00 Oct 17 2026 00:00:00 Apr 15 2027
  accept-lifetime 00:00:00 Oct 17 2026 00:00:00 Apr 15 2027
!
key chain BGP-AS64500 tcp
 key 1
  send-id 1
  recv-id 1
  key-string <BGP-AS64500-KEY>
  cryptographic-algorithm hmac-sha-256
  send-lifetime 00:00:00 Oct 17 2026 00:00:00 Apr 15 2027
  accept-lifetime 00:00:00 Oct 17 2026 00:00:00 Apr 15 2027
!
interface GigabitEthernet0/0/0
 description ISP uplink
 ip address 203.0.113.2 255.255.255.252
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no cdp enable
 no lldp transmit
 no lldp receive
 ip access-group EXTERNAL-IN in
 ip access-group EXTERNAL-OUT out
 no shutdown
!
interface GigabitEthernet0/0/1
 description to CORE-SW1
 ip address 10.0.0.1 255.255.255.252
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 ip verify unicast source reachable-via rx
 ip ospf 1 area 0
 ip ospf authentication key-chain OSPF-KEYS
 ip access-group EGRESS-FILTER in
 no shutdown
!
interface Loopback0
 ip address 10.255.0.1 255.255.255.255
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 ip ospf 1 area 0
 no shutdown
!
interface Null0
 no ip unreachables
!
router ospf 1
 router-id 10.255.0.1
 auto-cost reference-bandwidth 100000
 passive-interface default
 no passive-interface GigabitEthernet0/0/1
!
ip prefix-list BGP-IN seq 5 deny 0.0.0.0/8 le 32
ip prefix-list BGP-IN seq 10 deny 10.0.0.0/8 le 32
ip prefix-list BGP-IN seq 15 deny 100.64.0.0/10 le 32
ip prefix-list BGP-IN seq 20 deny 127.0.0.0/8 le 32
ip prefix-list BGP-IN seq 25 deny 169.254.0.0/16 le 32
ip prefix-list BGP-IN seq 30 deny 172.16.0.0/12 le 32
ip prefix-list BGP-IN seq 35 deny 192.0.0.0/24 le 32
ip prefix-list BGP-IN seq 40 deny 192.0.2.0/24 le 32
ip prefix-list BGP-IN seq 45 deny 192.88.99.0/24 le 32
ip prefix-list BGP-IN seq 50 deny 192.168.0.0/16 le 32
ip prefix-list BGP-IN seq 55 deny 198.18.0.0/15 le 32
ip prefix-list BGP-IN seq 60 deny 198.51.100.0/24 le 32
ip prefix-list BGP-IN seq 65 deny 203.0.113.0/24 le 32
ip prefix-list BGP-IN seq 70 deny 224.0.0.0/4 le 32
ip prefix-list BGP-IN seq 75 deny 240.0.0.0/4 le 32
ip prefix-list BGP-IN seq 105 deny 198.51.100.0/24 le 32
ip prefix-list BGP-IN seq 500 permit 0.0.0.0/0 ge 8 le 24
ip prefix-list BGP-OUT seq 5 permit 198.51.100.0/24
!
router bgp 65010
 bgp router-id 10.255.0.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 203.0.113.1 remote-as 64500
 neighbor 203.0.113.1 description ISP-A
 neighbor 203.0.113.1 ao BGP-AS64500
 neighbor 203.0.113.1 ttl-security hops 1
 !
 address-family ipv4
  network 198.51.100.0 mask 255.255.255.0
  neighbor 203.0.113.1 activate
  neighbor 203.0.113.1 prefix-list BGP-IN in
  neighbor 203.0.113.1 prefix-list BGP-OUT out
  neighbor 203.0.113.1 maximum-prefix 1000 90 restart 15
 exit-address-family
!
ip route 198.51.100.0 255.255.255.0 Null0 name BGP-ANCHOR
ip access-list extended EXTERNAL-IN
 deny ip any any option any-options log-input
 permit tcp host 203.0.113.1 any eq bgp
 permit tcp host 203.0.113.1 eq bgp any
 deny ip 0.0.0.0 0.255.255.255 any log-input
 deny ip 10.0.0.0 0.255.255.255 any log-input
 deny ip 100.64.0.0 0.63.255.255 any log-input
 deny ip 127.0.0.0 0.255.255.255 any log-input
 deny ip 169.254.0.0 0.0.255.255 any log-input
 deny ip 172.16.0.0 0.15.255.255 any log-input
 deny ip 192.0.0.0 0.0.0.255 any log-input
 deny ip 192.0.2.0 0.0.0.255 any log-input
 deny ip 192.88.99.0 0.0.0.255 any log-input
 deny ip 192.168.0.0 0.0.255.255 any log-input
 deny ip 198.18.0.0 0.1.255.255 any log-input
 deny ip 198.51.100.0 0.0.0.255 any log-input
 deny ip 203.0.113.0 0.0.0.255 any log-input
 deny ip 224.0.0.0 15.255.255.255 any log-input
 deny ip 240.0.0.0 15.255.255.255 any log-input
 permit tcp any any established
 permit icmp any any echo-reply
 permit icmp any any time-exceeded
 permit icmp any any unreachable
 deny ip any any log-input
!
ip access-list extended EXTERNAL-OUT
 deny tcp any any eq tacacs log-input
 deny tcp any any eq 22 log-input
 deny udp any any eq snmp log-input
 deny udp any any eq snmptrap log-input
 deny udp any any eq syslog log-input
 permit ip any any
!
ip access-list extended EGRESS-FILTER
 permit ip 10.0.0.0 0.0.0.3 any
 permit ip 10.10.0.0 0.0.0.255 any
 permit ip 10.20.0.0 0.0.0.255 any
 permit ip 10.99.0.0 0.0.0.255 any
 permit ip 10.255.0.1 0.0.0.0 any
 permit ip 10.255.0.2 0.0.0.0 any
 deny ip any any log-input
!
ip access-list standard MGMT-ACCESS
 permit 10.99.0.0 0.0.0.255
 deny any log
!
ip access-list extended COPP-ROUTING
 permit tcp any any eq bgp
 permit tcp any eq bgp any
 permit ospf any any
 permit eigrp any any
ip access-list extended COPP-MANAGEMENT
 permit tcp any any eq 22
 permit udp any any eq snmp
 permit udp any eq ntp any
 permit tcp any eq tacacs any
 permit udp any eq 1812 any
 permit udp any eq 1813 any
ip access-list extended COPP-ICMP
 permit icmp any any
class-map match-all COPP-ROUTING
 match access-group name COPP-ROUTING
class-map match-all COPP-MANAGEMENT
 match access-group name COPP-MANAGEMENT
class-map match-all COPP-ICMP
 match access-group name COPP-ICMP
policy-map COPP
 class COPP-ROUTING
 class COPP-MANAGEMENT
  police cir 1000000 conform-action transmit exceed-action drop
 class COPP-ICMP
  police cir 128000 conform-action transmit exceed-action drop
 class class-default
  police cir 1000000 conform-action transmit exceed-action drop
control-plane
 service-policy input COPP
!
logging buffered 64000 informational
logging host 10.99.0.20
logging host 10.99.0.21
logging trap informational
ntp authentication-key 1 hmac-sha2-256 <NTP-KEY>
ntp authenticate
ntp trusted-key 1
ntp server 10.99.0.10 key 1
ntp server 10.99.0.11 key 1
!
snmp-server view ONECONFIG-VIEW iso included
snmp-server group ONECONFIG-RO v3 priv read ONECONFIG-VIEW access MGMT-ACCESS
snmp-server user <SNMP-USER> ONECONFIG-RO v3 auth sha <SNMP-AUTH-PASS> priv aes 256 <SNMP-PRIV-PASS>
!
event manager applet BACKUP_CONFIG
 event syslog pattern "%SYS-5-CONFIG_I"
 action 1 info type routername
 action 2 cli command "enable"
 action 3 cli command "copy run scp" pattern "remote host"
 action 4 cli command "10.99.0.60" pattern "filename"
 action 5 cli command "$_info_routername-config"
 action 6 syslog priority informational msg "Configuration backup was executed"
!
banner login ^
You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.
By using this IS (which includes any device attached to this IS), you consent to the following conditions:
-The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.
-At any time, the USG may inspect and seize data stored on this IS.
-Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.
-This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy.
-Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details.
^
!
line con 0
 exec-timeout 5 0
 logging synchronous
line aux 0
 no exec
 transport input none
line vty 0 1
 access-class MGMT-ACCESS in
 exec-timeout 5 0
 transport input ssh
 transport output ssh
line vty 2 15
 transport input none
 transport output none
!
end