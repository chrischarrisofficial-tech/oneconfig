## OneConfig | Edge Firewall | EDGE-FW1 (firewall, PAN-OS)
## Replace every <ANGLE-BRACKET> placeholder before deploying. OneConfig hashes <...SHA256> values itself.
set deviceconfig system hostname EDGE-FW1
set deviceconfig system domain corp.local
set deviceconfig system timezone UTC
set deviceconfig system login-banner "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only. By using this IS (which includes any device attached to this IS), you consent to the following conditions: -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations. -At any time, the USG may inspect and seize data stored on this IS. -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose. -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy. -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details."
set deviceconfig system ntp-servers primary-ntp-server ntp-server-address 10.99.0.10
set deviceconfig system ntp-servers primary-ntp-server authentication-type symmetric-key key-id 1
set deviceconfig system ntp-servers primary-ntp-server authentication-type symmetric-key algorithm sha1 authentication-key <NTP-KEY>
set deviceconfig system ntp-servers secondary-ntp-server ntp-server-address 10.99.0.11
set deviceconfig system ntp-servers secondary-ntp-server authentication-type symmetric-key key-id 2
set deviceconfig system ntp-servers secondary-ntp-server authentication-type symmetric-key algorithm sha1 authentication-key <NTP-KEY>
## SNMPv3 only (STIG PANW-NM-000118). Add the v3 view and user under Device > Setup > Operations > SNMP Setup.
set deviceconfig system snmp-setting access-setting version v3
## Content updates (STIG PANW-AG-000060, PANW-IP-000024)
set deviceconfig system update-schedule threats recurring every-30-mins at 2
set deviceconfig system update-schedule threats recurring every-30-mins action download-and-install
set deviceconfig system update-schedule anti-virus recurring hourly at 4
set deviceconfig system update-schedule anti-virus recurring hourly action download-and-install
set deviceconfig system update-schedule wildfire recurring real-time
set deviceconfig setting management idle-timeout 10
set deviceconfig setting management enable-log-high-dp-load yes
set mgt-config password-complexity enabled yes
set mgt-config password-complexity minimum-length 15
set mgt-config password-complexity minimum-uppercase-letters 1
set mgt-config password-complexity minimum-lowercase-letters 1
set mgt-config password-complexity minimum-numeric-letters 1
set mgt-config password-complexity minimum-special-characters 1
set mgt-config password-complexity new-password-differs-by-characters 8
set mgt-config password-complexity block-username-inclusion yes
set mgt-config password-complexity password-history-count 24
## Local account of last resort: its authentication profile locks it after 3 failures until an admin unlocks it
set shared local-user-database user <ADMIN-USER> phash "<ADMIN-SECRET.SHA256>"
set shared authentication-profile LAST-RESORT method local-database
set shared authentication-profile LAST-RESORT lockout failed-attempts 3
set shared authentication-profile LAST-RESORT lockout lockout-time 0
set shared authentication-profile LAST-RESORT allow-list all
set mgt-config users <ADMIN-USER> authentication-profile LAST-RESORT
set mgt-config users <ADMIN-USER> permissions role-based superuser yes
set shared server-profile tacplus TACACS-SERVERS server TACACS-1 address 10.99.0.40
set shared server-profile tacplus TACACS-SERVERS server TACACS-1 secret <TACACS-KEY>
set shared server-profile tacplus TACACS-SERVERS server TACACS-2 address 10.99.0.41
set shared server-profile tacplus TACACS-SERVERS server TACACS-2 secret <TACACS-KEY>
set shared server-profile tacplus TACACS-SERVERS protocol CHAP
## Remote administrators: select REMOTE-ADMIN under Device > Setup > Management > Authentication Settings
set shared authentication-profile REMOTE-ADMIN method tacplus server-profile TACACS-SERVERS
set shared authentication-profile REMOTE-ADMIN lockout failed-attempts 3
set shared authentication-profile REMOTE-ADMIN lockout lockout-time 0
set shared authentication-profile REMOTE-ADMIN allow-list all
set shared log-settings syslog SYSLOG-SERVERS server SYSLOG-1 server 10.99.0.20
set shared log-settings syslog SYSLOG-SERVERS server SYSLOG-1 transport UDP
