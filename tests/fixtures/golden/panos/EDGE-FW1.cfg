set deviceconfig high-availability enabled yes
set deviceconfig high-availability group group-id 1
set deviceconfig high-availability group peer-ip 10.255.255.2
set deviceconfig high-availability group mode active-passive
set deviceconfig high-availability group configuration-synchronization enabled yes
set deviceconfig high-availability group election-option device-priority 100
set deviceconfig high-availability interface ha1 port ethernet1/8
set deviceconfig high-availability interface ha1 ip-address 10.255.255.1
set deviceconfig high-availability interface ha1 netmask 255.255.255.252
## On the peer: the same lines with ip-address 10.255.255.2, peer-ip 10.255.255.1 and device-priority 110
