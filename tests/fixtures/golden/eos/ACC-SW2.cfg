!
! OneConfig | Campus Starter | ACC-SW2 (switch, EOS)
! Replace every <ANGLE-BRACKET> placeholder before deploying.
!
hostname ACC-SW2
ip domain-name corp.local
no ip domain lookup
!
! Local account of last resort, used only when the AAA servers are unreachable
username <ADMIN-USER> privilege 15 role network-admin secret 0 <ADMIN-SECRET>
!
management security
   password minimum length 15
!
aaa authentication policy lockout failure 3 duration 900
aaa authentication policy on-success log
aaa authentication policy on-failure log
tacacs-server host 10.99.0.40 key 0 <TACACS-KEY>
tacacs-server host 10.99.0.41 key 0 <TACACS-KEY>
aaa group server tacacs+ TACACS-SERVERS
   server 10.99.0.40
   server 10.99.0.41
radius-server host 10.99.0.50 key 0 <RADIUS-KEY>
radius-server host 10.99.0.51 key 0 <RADIUS-KEY>
aaa group server radius RADIUS-SERVERS
   server 10.99.0.50
   server 10.99.0.51
aaa authentication login default group TACACS-SERVERS local
aaa authorization exec default group TACACS-SERVERS local
aaa authorization commands all default group TACACS-SERVERS local
aaa accounting exec default start-stop group TACACS-SERVERS logging
aaa accounting commands all default start-stop logging group TACACS-SERVERS
aaa accounting system default start-stop group TACACS-SERVERS logging
aaa authentication dot1x default group RADIUS-SERVERS
dot1x system-auth-control
!
management ssh
   idle-timeout 5
   connection limit 5
   cipher aes256-ctr aes192-ctr aes128-ctr
   mac hmac-sha2-512 hmac-sha2-256
   fips restrictions
   ip access-group MGMT-ACCESS in
!
management console
   idle-timeout 5
!
management telnet
   shutdown
!
management api http-commands
   shutdown
!
vlan 10
   name USERS
vlan 20
   name VOICE
vlan 99
   name MGMT
vlan 998
   name PARKING
vlan 999
   name NATIVE-UNUSED
!
spanning-tree mode rapid-pvst
spanning-tree guard loop default
ip dhcp snooping
ip dhcp snooping information option
ip dhcp snooping vlan 10
ip arp inspection vlan 10
!
interface Vlan1
   shutdown
!
interface Ethernet48
   description to CORE-SW1
   switchport mode trunk
   switchport trunk native vlan 999
   switchport trunk allowed vlan 10,20,99
   ip arp inspection trust
   no shutdown
!
interface Ethernet1
   description Desk 201
   switchport mode access
   switchport access vlan 10
   spanning-tree portfast
   spanning-tree bpduguard enable
   switchport port-security
   switchport port-security mac-address maximum 1
   storm-control broadcast level pps 5000
   storm-control multicast level pps 5000
   ip verify source
   dot1x pae authenticator
   dot1x port-control auto
   dot1x host-mode single-host
   dot1x mac based authentication
   no shutdown
!
interface Vlan99
   ip address 10.99.0.12/24
   no ip proxy-arp
   no shutdown
!
ip route 0.0.0.0/0 10.99.0.1
ip access-list MGMT-ACCESS
   10 permit ip 10.99.0.0/24 any
   20 deny ip any any log
!
logging buffered 64000 informational
logging host 10.99.0.20
logging host 10.99.0.21
logging trap informational
clock timezone UTC
ntp authentication-key 1 sha1 0 <NTP-KEY>
ntp trusted-key 1
ntp authenticate servers
ntp server 10.99.0.10 key 1
ntp server 10.99.0.11 key 1
!
snmp-server view ONECONFIG-VIEW iso included
snmp-server group ONECONFIG-RO v3 priv read ONECONFIG-VIEW
snmp-server user <SNMP-USER> ONECONFIG-RO v3 auth sha256 <SNMP-AUTH-PASS> priv aes256 <SNMP-PRIV-PASS>
!
! DISA ARST-ND-000820: keep a dated copy of every saved config. Copy them to 10.99.0.60 on your schedule.
event-handler CFG_BACKUP
   trigger on-startup-config
   action bash cp /mnt/flash/startup-config /mnt/flash/startup-config_$(date +%Y%m%d%H%M%S)
!
banner login
You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.
By using this IS (which includes any device attached to this IS), you consent to the following conditions:
-The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.
-At any time, the USG may inspect and seize data stored on this IS.
-Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.
-This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy.
-Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details.
EOF
!
end