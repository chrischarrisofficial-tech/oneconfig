!
! OneConfig | Campus Starter | EDGE-R1 (router, EOS)
! Replace every <ANGLE-BRACKET> placeholder before deploying.
!
hostname EDGE-R1
ip domain-name corp.local
no ip domain lookup
!
! Local account of last resort, used only when the AAA servers are unreachable
username <ADMIN-USER> privilege 15 role network-admin secret 0 <ADMIN-SECRET>
!
management security
   password minimum length 15
!
aaa authentication policy lockout failure 3 duration 900
aaa authentication policy on-success log
aaa authentication policy on-failure log
tacacs-server host 10.99.0.40 key 0 <TACACS-KEY>
tacacs-server host 10.99.0.41 key 0 <TACACS-KEY>
aaa group server tacacs+ TACACS-SERVERS
   server 10.99.0.40
   server 10.99.0.41
radius-server host 10.99.0.50 key 0 <RADIUS-KEY>
radius-server host 10.99.0.51 key 0 <RADIUS-KEY>
aaa group server radius RADIUS-SERVERS
   server 10.99.0.50
   server 10.99.0.51
aaa authentication login default group TACACS-SERVERS local
aaa authorization exec default group TACACS-SERVERS local
aaa authorization commands all default group TACACS-SERVERS local
aaa accounting exec default start-stop group TACACS-SERVERS logging
aaa accounting commands all default start-stop logging group TACACS-SERVERS
aaa accounting system default start-stop group TACACS-SERVERS logging
!
management ssh
   idle-timeout 5
   connection limit 5
   cipher aes256-ctr aes192-ctr aes128-ctr
   mac hmac-sha2-512 hmac-sha2-256
   fips restrictions
   ip access-group MGMT-ACCESS in
!
management console
   idle-timeout 5
!
management telnet
   shutdown
!
management api http-commands
   shutdown
!
ip routing
ip icmp rate-limit-unreachable 0
!
interface Ethernet1
   description ISP uplink
   ip address 203.0.113.2/30
   no ip proxy-arp
   no arp gratuitous accept
   no lldp transmit
   no lldp receive
   ip access-group EXTERNAL-IN in
   ip access-group EXTERNAL-OUT out
   no shutdown
!
interface Ethernet2
   description to CORE-SW1
   ip address 10.0.0.1/30
   no ip proxy-arp
   ip verify unicast source reachable-via rx
   ip ospf area 0.0.0.0
   ip ospf authentication message-digest
   ip ospf message-digest-key 1 sha256 0 <OSPF-KEY>
   ip access-group EGRESS-FILTER in
   no shutdown
!
interface Loopback0
   ip address 10.255.0.1/32
   ip ospf area 0.0.0.0
   no shutdown
!
router ospf 1
   router-id 10.255.0.1
   auto-cost reference-bandwidth 100000
   passive-interface default
   no passive-interface Ethernet2
!
ip prefix-list BGP-IN seq 5 deny 0.0.0.0/8 le 32
ip prefix-list BGP-IN seq 10 deny 10.0.0.0/8 le 32
ip prefix-list BGP-IN seq 15 deny 100.64.0.0/10 le 32
ip prefix-list BGP-IN seq 20 deny 127.0.0.0/8 le 32
ip prefix-list BGP-IN seq 25 deny 169.254.0.0/16 le 32
ip prefix-list BGP-IN seq 30 deny 172.16.0.0/12 le 32
ip prefix-list BGP-IN seq 35 deny 192.0.0.0/24 le 32
ip prefix-list BGP-IN seq 40 deny 192.0.2.0/24 le 32
ip prefix-list BGP-IN seq 45 deny 192.88.99.0/24 le 32
ip prefix-list BGP-IN seq 50 deny 192.168.0.0/16 le 32
ip prefix-list BGP-IN seq 55 deny 198.18.0.0/15 le 32
ip prefix-list BGP-IN seq 60 deny 198.51.100.0/24 le 32
ip prefix-list BGP-IN seq 65 deny 203.0.113.0/24 le 32
ip prefix-list BGP-IN seq 70 deny 224.0.0.0/4 le 32
ip prefix-list BGP-IN seq 75 deny 240.0.0.0/4 le 32
ip prefix-list BGP-IN seq 105 deny 198.51.100.0/24 le 32
ip prefix-list BGP-IN seq 500 permit 0.0.0.0/0 ge 8 le 24
ip prefix-list BGP-OUT seq 5 permit 198.51.100.0/24
!
router bgp 65010
   router-id 10.255.0.1
   bgp enforce-first-as
   neighbor 203.0.113.1 remote-as 64500
   neighbor 203.0.113.1 description ISP-A
   neighbor 203.0.113.1 password 0 <BGP-AS64500-KEY>
   neighbor 203.0.113.1 ttl maximum-hops 1
   neighbor 203.0.113.1 prefix-list BGP-IN in
   neighbor 203.0.113.1 prefix-list BGP-OUT out
   neighbor 203.0.113.1 maximum-routes 1000
   network 198.51.100.0/24
!
ip route 198.51.100.0/24 Null0 name BGP-ANCHOR
ip access-list EXTERNAL-IN
   deny icmp any any fragments log
   permit tcp host 203.0.113.1 any eq bgp
   permit tcp host 203.0.113.1 eq bgp any
   deny ip 0.0.0.0/8 any log
   deny ip 10.0.0.0/8 any log
   deny ip 100.64.0.0/10 any log
   deny ip 127.0.0.0/8 any log
   deny ip 169.254.0.0/16 any log
   deny ip 172.16.0.0/12 any log
   deny ip 192.0.0.0/24 any log
   deny ip 192.0.2.0/24 any log
   deny ip 192.88.99.0/24 any log
   deny ip 192.168.0.0/16 any log
   deny ip 198.18.0.0/15 any log
   deny ip 198.51.100.0/24 any log
   deny ip 203.0.113.0/24 any log
   deny ip 224.0.0.0/4 any log
   deny ip 240.0.0.0/4 any log
   permit tcp any any established
   permit icmp any any echo-reply
   permit icmp any any time-exceeded
   permit icmp any any unreachable
   deny ip any any log
!
ip access-list EXTERNAL-OUT
   deny icmp any any mask-reply log
   deny icmp any any redirect log
   deny tcp any any eq tacacs log
   deny tcp any any eq 22 log
   deny udp any any eq snmp log
   deny udp any any eq snmptrap log
   deny udp any any eq syslog log
   permit ip any any
!
ip access-list EGRESS-FILTER
   permit ip 10.0.0.0/30 any
   permit ip 10.10.0.0/24 any
   permit ip 10.20.0.0/24 any
   permit ip 10.99.0.0/24 any
   permit ip 10.255.0.1/32 any
   permit ip 10.255.0.2/32 any
   deny ip any any log
!
ip access-list MGMT-ACCESS
   10 permit ip 10.99.0.0/24 any
   20 deny ip any any log
!
logging buffered 64000 informational
logging host 10.99.0.20
logging host 10.99.0.21
logging trap informational
clock timezone UTC
ntp authentication-key 1 sha1 0 <NTP-KEY>
ntp trusted-key 1
ntp authenticate servers
ntp server 10.99.0.10 key 1
ntp server 10.99.0.11 key 1
!
snmp-server view ONECONFIG-VIEW iso included
snmp-server group ONECONFIG-RO v3 priv read ONECONFIG-VIEW
snmp-server user <SNMP-USER> ONECONFIG-RO v3 auth sha256 <SNMP-AUTH-PASS> priv aes256 <SNMP-PRIV-PASS>
!
! DISA ARST-ND-000820: keep a dated copy of every saved config. Copy them to 10.99.0.60 on your schedule.
event-handler CFG_BACKUP
   trigger on-startup-config
   action bash cp /mnt/flash/startup-config /mnt/flash/startup-config_$(date +%Y%m%d%H%M%S)
!
banner login
