!
! OneConfig | Campus Starter | CORE-SW1 (l3switch, NX-OS)
! Replace every <ANGLE-BRACKET> placeholder before deploying.
!
hostname CORE-SW1
!
feature tacacs+
feature interface-vlan
feature lacp
feature udld
feature dhcp
feature ospf
no feature telnet
!
password strength-check
! Local account of last resort, used only when the AAA servers are unreachable
username <ADMIN-USER> password 0 <ADMIN-SECRET> role network-admin
!
ip domain-name corp.local
no ip domain-lookup
no ip source-route
!
ssh login-attempts 3
ssh macs hmac-sha2-256 hmac-sha2-512
ssh ciphers aes256-ctr aes128-ctr
! Generate SSH keys once from exec mode: ssh key rsa 2048 force
!
tacacs-server host 10.99.0.40 key 0 <TACACS-KEY>
tacacs-server host 10.99.0.41 key 0 <TACACS-KEY>
aaa group server tacacs+ TACACS-SERVERS
  server 10.99.0.40
  server 10.99.0.41
radius-server host 10.99.0.50 key 0 <RADIUS-KEY>
radius-server host 10.99.0.51 key 0 <RADIUS-KEY>
aaa group server radius RADIUS-SERVERS
  server 10.99.0.50
  server 10.99.0.51
aaa authentication login default group TACACS-SERVERS
aaa authentication login console group TACACS-SERVERS
aaa authentication login default fallback error local
aaa accounting default group TACACS-SERVERS
!
vlan 10
  name USERS
vlan 20
  name VOICE
vlan 99
  name MGMT
vlan 998
  name PARKING
vlan 999
  name NATIVE-UNUSED
!
spanning-tree loopguard default
!
key chain OSPF-KEYS
  key 1
    key-string 0 <OSPF-KEY>
    cryptographic-algorithm hmac-sha-256
    send-lifetime 00:00:00 Oct 17 2026 00:00:00 Apr 15 2027
    accept-lifetime 00:00:00 Oct 17 2026 00:00:00 Apr 15 2027
!
interface Ethernet1/1
  description to EDGE-R1
  no switchport
  ip address 10.0.0.2/30
  no ip redirects
  no ip unreachables
  no ip proxy-arp
  ip router ospf 1 area 0.0.0.0
  no ip ospf passive-interface
  ip ospf authentication key-chain OSPF-KEYS
  no shutdown
!
interface port-channel1
  description to ACC-SW1
  switchport
  switchport mode trunk
  switchport trunk native vlan 999
  switchport trunk allowed vlan 10,20,99
  spanning-tree guard root
  ip dhcp snooping trust
  ip arp inspection trust
  no shutdown
!
interface Ethernet1/2
  switchport
  switchport mode trunk
  switchport trunk native vlan 999
  switchport trunk allowed vlan 10,20,99
  ip dhcp snooping trust
  ip arp inspection trust
  channel-group 1 mode active
  no shutdown
!
interface Ethernet1/3
  switchport
  switchport mode trunk
  switchport trunk native vlan 999
  switchport trunk allowed vlan 10,20,99
  ip dhcp snooping trust
  ip arp inspection trust
  channel-group 1 mode active
  no shutdown
!
interface Ethernet1/4
  description to ACC-SW2
  switchport
  switchport mode trunk
  switchport trunk native vlan 999
  switchport trunk allowed vlan 10,20,99
  spanning-tree guard root
  ip dhcp snooping trust
  ip arp inspection trust
  no shutdown
!
interface Vlan10
  description Users gateway
  ip address 10.10.0.1/24
  ip dhcp relay address 10.99.0.30
  no ip redirects
  no ip unreachables
  no ip proxy-arp
  ip router ospf 1 area 0.0.0.0
  no shutdown
!
interface Vlan20
  description Voice gateway
  ip address 10.20.0.1/24
  no ip redirects
  no ip unreachables
  no ip proxy-arp
  ip router ospf 1 area 0.0.0.0
  no shutdown
!
interface Vlan99
  description Management
  ip address 10.99.0.1/24
  no ip redirects
  no ip unreachables
  no ip proxy-arp
  ip router ospf 1 area 0.0.0.0
  no shutdown
!
interface loopback0
  ip address 10.255.0.2/32
  ip router ospf 1 area 0.0.0.0
  no shutdown
!
router ospf 1
  router-id 10.255.0.2
  auto-cost reference-bandwidth 100000
  passive-interface default
!
ip access-list MGMT-ACCESS
  10 permit ip 10.99.0.0/24 any
  20 deny ip any any log
!
copp profile strict
!
logging logfile messages 6 size 4096
logging ip access-list cache entries 8000
logging level authpriv 6
logging server 10.99.0.20 6
logging server 10.99.0.21 6
clock timezone UTC 0 0
ntp authentication-key 1 md5 <NTP-KEY>
ntp authenticate
ntp trusted-key 1
ntp server 10.99.0.10 key 1
ntp server 10.99.0.11 key 1
!
snmp-server user <SNMP-USER> auth sha <SNMP-AUTH-PASS> priv aes-128 <SNMP-PRIV-PASS>
!
event manager applet BACKUP_CONFIG
  event syslog pattern "SYSLOG_CONFIG_I"
  action 1 cli copy running-config scp://<BACKUP-USER>@10.99.0.60/CORE-SW1.cfg
  action 2 syslog priority informational msg "Configuration backup was executed"
!
banner motd ^
You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only.
By using this IS (which includes any device attached to this IS), you consent to the following conditions:
-The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations.
-At any time, the USG may inspect and seize data stored on this IS.
-Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose.
