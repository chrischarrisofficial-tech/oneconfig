#### Policies match top to bottom; anything not accepted here hits the implicit deny, which is logged
config firewall policy
    edit 1
        set name "INSIDE-TO-DMZ-WEB"
        set srcintf "INSIDE"
        set dstintf "DMZ"
        set srcaddr "INSIDE-NETS"
        set dstaddr "DMZ-SERVERS"
        set action accept
        set schedule "always"
        set service "WEB"
        set logtraffic all
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        set ips-sensor "default"
    next
    edit 2
        set name "INSIDE-TO-INTERNET-WEB"
        set srcintf "INSIDE"
        set dstintf "OUTSIDE"
        set srcaddr "INSIDE-NETS"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "WEB"
        set logtraffic all
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        set ips-sensor "default"
    next
    edit 3
        set name "DNS-TO-INTERNET"
        set srcintf "INSIDE"
        set dstintf "OUTSIDE"
        set srcaddr "DNS-SRV"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "DNS-ALL"
        set logtraffic all
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        set ips-sensor "default"
    next
    edit 4
        set name "INTERNET-TO-WEB"
        set srcintf "OUTSIDE"
        set dstintf "DMZ"
        set srcaddr "all"
        set dstaddr "WEB-SRV"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        set ips-sensor "default"
    next
    edit 5
        set name "DMZ-TO-INTERNET-WEB"
        set srcintf "DMZ"
        set dstintf "OUTSIDE"
        set srcaddr "DMZ-SERVERS"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "WEB"
        set logtraffic all
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        set ips-sensor "default"
    next
end
#### FGCP active/passive pair. The heartbeat link needs no addresses. On the peer: the same block with priority 100.
config system ha
    set group-name "ONECONFIG"
    set mode a-p
    set password "<HA-KEY>"
    set hbdev "port8" 50
    set session-pickup enable
    set override disable
    set priority 200
    set monitor "port1" "port2" "port3"
end
