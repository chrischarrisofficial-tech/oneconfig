#### OneConfig | Edge Firewall | EDGE-FW1 (firewall, FortiOS)
#### Replace every <ANGLE-BRACKET> placeholder before deploying.
config system global
    set hostname "EDGE-FW1"
    set admintimeout 10
    set admin-lockout-threshold 3
    set admin-lockout-duration 900
    set admin-concurrent disable
    set pre-login-banner enable
    set cli-audit-log enable
    set revision-backup-on-logout enable
    set admin-https-ssl-versions tlsv1-2 tlsv1-3
    set ssl-min-proto-version TLSv1-2
    set strong-crypto enable
    set admin-ssh-v1 disable
    set admin-telnet disable
    set av-failopen off
    set av-failopen-session disable
end
config system replacemsg admin "pre_admin-disclaimer-text"
    set buffer "You are accessing a U.S. Government (USG) Information System (IS) that is provided for USG-authorized use only. By using this IS (which includes any device attached to this IS), you consent to the following conditions: -The USG routinely intercepts and monitors communications on this IS for purposes including, but not limited to, penetration testing, COMSEC monitoring, network operations and defense, personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI) investigations. -At any time, the USG may inspect and seize data stored on this IS. -Communications using, or data stored on, this IS are not private, are subject to routine monitoring, interception, and search, and may be disclosed or used for any USG-authorized purpose. -This IS includes security measures (e.g., authentication and access controls) to protect USG interests--not for your personal benefit or privacy. -Notwithstanding the above, using this IS does not constitute consent to PM, LE or CI investigative searching or monitoring of the content of privileged communications, or work product, related to personal representation or services by attorneys, psychotherapists, or clergy, and their assistants. Such communications and work product are private and confidential. See User Agreement for details."
end
config system settings
    set central-nat enable
    set asymroute disable
    set asymroute-icmp disable
    set asymroute6 disable
end
config ips global
    set fail-open disable
end
config system password-policy
    set status enable
    set apply-to admin-password
    set minimum-length 15
    set min-upper-case-letter 1
    set min-lower-case-letter 1
    set min-number 1
    set min-non-alphanumeric 1
end
config system ntp
    set ntpsync enable
    set type custom
    set syncinterval 60
    config ntpserver
        edit 1
            set server "10.99.0.10"
            set authentication enable
            set key-type SHA256
            set key-id 1
            set key "<NTP-KEY>"
        next
        edit 2
            set server "10.99.0.11"
            set authentication enable
            set key-type SHA256
            set key-id 1
            set key "<NTP-KEY>"
        next
    end
end
#### Local account of last resort, reachable only from the management network
config system admin
    edit "<ADMIN-USER>"
        set accprofile "super_admin"
        set password "<ADMIN-SECRET>"
        set trusthost1 10.99.0.0 255.255.255.0
    next
    edit "REMOTE-ADMIN"
        set remote-auth enable
        set wildcard enable
        set remote-group "REMOTE-ADMINS"
        set accprofile "super_admin"
        set trusthost1 10.99.0.0 255.255.255.0
    next
end
config user tacacs+
    edit "TACACS-1"
        set server "10.99.0.40"
        set key "<TACACS-KEY>"
    next
    edit "TACACS-2"
        set server "10.99.0.41"
        set key "<TACACS-KEY>"
    next
end
config user group
    edit "REMOTE-ADMINS"
        set member "TACACS-1" "TACACS-2"
    next
end
config system snmp sysinfo
    set status enable
end
config system snmp user
    edit "<SNMP-USER>"
        set security-level auth-priv
        set auth-proto sha256
        set auth-pwd "<SNMP-AUTH-PASS>"
        set priv-proto aes256
        set priv-pwd "<SNMP-PRIV-PASS>"
        set queries enable
    next
end
#### Logging: every event category, implicit-deny traffic, local disk that overwrites when full (STIG FNFG-FW-000045)
config log eventfilter
    set event enable
    set system enable
    set user enable
    set endpoint enable
end
config log setting
    set user-anonymize disable
    set fwpolicy-implicit-log enable
end
config log disk setting
    set status enable
    set diskfull overwrite
    set max-log-file-size 100
end
#### Syslog over TLS (STIG FNFG-FW-000050): the server must accept RFC 5425 syslog on TCP 6514
config log syslogd setting
    set status enable
    set server "10.99.0.20"
    set mode reliable
    set port 6514
    set enc-algorithm high
end
#### Syslog over TLS (STIG FNFG-FW-000050): the server must accept RFC 5425 syslog on TCP 6514
config log syslogd2 setting
    set status enable
    set server "10.99.0.21"
    set mode reliable
    set port 6514
    set enc-algorithm high
end
config system interface
    edit "port1"
        set ip 203.0.113.2 255.255.255.248
        unset allowaccess
        set role wan
        set description "ISP uplink"
        set dhcp-relay-service disable
        set pptp-client disable
        set arpforward disable
        set broadcast-forward disable
        set l2forward disable
        set icmp-send-redirect disable
        set vlanforward disable
        set stpforward disable
        set lldp-transmission disable
        set status up
    next
    edit "port2"
        set ip 10.0.0.1 255.255.255.248
        set allowaccess ping
        set role lan
        set description "to CORE-SW1"
        set dhcp-relay-service disable
        set pptp-client disable
        set arpforward disable
        set broadcast-forward disable
        set l2forward disable
        set icmp-send-redirect disable
        set vlanforward disable
        set stpforward disable
        set lldp-transmission disable
        set status up
    next
    edit "port3"
        set ip 172.16.10.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "DMZ servers"
        set dhcp-relay-service disable
        set pptp-client disable
        set arpforward disable
        set broadcast-forward disable
        set l2forward disable
        set icmp-send-redirect disable
        set vlanforward disable
        set stpforward disable
        set lldp-transmission disable
        set status up
    next
    edit "port4"
        set dhcp-relay-service disable
        set pptp-client disable
        set arpforward disable
        set broadcast-forward disable
        set l2forward disable
        set icmp-send-redirect disable
        set vlanforward disable
        set stpforward disable
        set lldp-transmission disable
        set status up
    next
    edit "port8"
        set description "to EDGE-FW2"
        set dhcp-relay-service disable
        set pptp-client disable
        set arpforward disable
        set broadcast-forward disable
        set l2forward disable
        set icmp-send-redirect disable
        set vlanforward disable
        set stpforward disable
        set lldp-transmission disable
        set status up
    next
end
config system zone
    edit "OUTSIDE"
        set interface "port1"
        set intrazone deny
    next
    edit "DMZ"
        set interface "port3"
        set intrazone deny
    next
    edit "INSIDE"
        set interface "port2"
        set intrazone deny
    next
end
config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 203.0.113.1
        set device "port1"
    next
end
config router ospf
    set router-id 10.0.0.1
    config area
        edit 0.0.0.0
        next
    end
    config ospf-interface
        edit "port2"
            set interface "port2"
            set authentication message-digest
            config md5-keys
                edit 1
                    set key-string "<OSPF-KEY>"
                next
            end
        next
    end
    config network
        edit 1
            set prefix 10.0.0.0 255.255.255.248
            set area 0.0.0.0
        next
    end
end
#### Bogon prefixes are never accepted from eBGP peers
config router prefix-list
    edit "DENY-BOGONS"
        config rule
            edit 1
                set action deny
                set prefix 0.0.0.0 255.0.0.0
                set le 32
            next
            edit 2
                set action deny
                set prefix 10.0.0.0 255.0.0.0
                set le 32
            next
            edit 3
                set action deny
                set prefix 100.64.0.0 255.192.0.0
                set le 32
            next
            edit 4
                set action deny
                set prefix 127.0.0.0 255.0.0.0
                set le 32
            next
            edit 5
                set action deny
                set prefix 169.254.0.0 255.255.0.0
                set le 32
            next
            edit 6
                set action deny
                set prefix 172.16.0.0 255.240.0.0
                set le 32
            next
            edit 7
                set action deny
                set prefix 192.0.0.0 255.255.255.0
                set le 32
            next
            edit 8
                set action deny
                set prefix 192.0.2.0 255.255.255.0
                set le 32
            next
            edit 9
                set action deny
                set prefix 192.88.99.0 255.255.255.0
                set le 32
            next
            edit 10
                set action deny
                set prefix 192.168.0.0 255.255.0.0
                set le 32
            next
            edit 11
                set action deny
                set prefix 198.18.0.0 255.254.0.0
                set le 32
            next
            edit 12
                set action deny
                set prefix 198.51.100.0 255.255.255.0
                set le 32
            next
            edit 13
                set action deny
                set prefix 203.0.113.0 255.255.255.0
                set le 32
            next
            edit 14
                set action deny
                set prefix 224.0.0.0 240.0.0.0
                set le 32
            next
            edit 15
                set action deny
                set prefix 240.0.0.0 240.0.0.0
                set le 32
            next
            edit 16
                set action permit
                set prefix 0.0.0.0 0.0.0.0
                set le 32
            next
        end
    next
end
config router bgp
    set as 65010
    set router-id 10.0.0.1
    config neighbor
        edit "203.0.113.1"
            set remote-as 64500
            set description "ISP-A"
            set password "<BGP-KEY>"
            set prefix-list-in "DENY-BOGONS"
            set maximum-prefix 1000
        next
    end
    config network
        edit 1
            set prefix 203.0.113.0 255.255.255.248
        next
    end
end
config firewall address
    edit "INSIDE-NETS"
        set subnet 10.0.0.0 255.0.0.0
    next
    edit "DNS-SRV"
        set subnet 10.10.0.53 255.255.255.255
    next
    edit "WEB-SRV"
        set subnet 172.16.10.10 255.255.255.255
    next
    edit "WEB-PUBLIC"
        set subnet 203.0.113.4 255.255.255.255
    next
end
config firewall addrgrp
    edit "DMZ-SERVERS"
        set member "WEB-SRV"
    next
end
config firewall service custom
    edit "HTTP"
        set tcp-portrange 80
    next
    edit "HTTPS"
        set tcp-portrange 443
    next
    edit "DNS-UDP"
        set udp-portrange 53
    next
    edit "DNS-TCP"
        set tcp-portrange 53
    next
end
config firewall service group
    edit "WEB"
        set member "HTTP" "HTTPS"
    next
    edit "DNS-ALL"
        set member "DNS-UDP" "DNS-TCP"
    next
end
config firewall vip
    edit "WEB-PUBLISH"
        set extip 203.0.113.4
        set mappedip "172.16.10.10"
        set extintf "port1"
        set portforward enable
        set protocol tcp
        set extport 443
        set mappedport 443
    next
end
config firewall central-snat-map
    edit 1
        set srcintf "INSIDE"
        set dstintf "OUTSIDE"
        set orig-addr "INSIDE-NETS"
        set dst-addr "all"
        set nat enable
        set comments "INSIDE-PAT"
    next
    edit 2
        set srcintf "DMZ"
        set dstintf "OUTSIDE"
        set orig-addr "DMZ-SERVERS"
        set dst-addr "all"
        set nat enable
        set comments "DMZ-PAT"
    next
end
#### DoS protection on every zone, inbound and outbound: floods, scans and sweeps are blocked and logged
config firewall DoS-policy
    edit 1
        set name "DOS-OUTSIDE"
        set interface "OUTSIDE"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        config anomaly
            edit "tcp_syn_flood"
                set status enable
                set log enable
                set action block
                set threshold 2000
            next
            edit "tcp_port_scan"
                set status enable
                set log enable
